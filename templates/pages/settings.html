{% extends "base.html" %}
{% block title %}Settings — Visionary Professionals{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Account Settings</h1>
    <p>Manage your carrier account settings.</p>
</section>

<section class="section">
    <div class="container">
        <div class="card reveal" style="max-width:700px;margin:0 auto;">
            <form method="post">
                {% csrf_token %}
                <h2>Profile Information</h2>
                <div class="form-grid">
                    <div class="form-group"><label>Full Legal Name</label><input type="text" name="full_name"></div>
                    <div class="form-group"><label>Email Address</label><input type="email" name="email"></div>
                    <div class="form-group"><label>Phone Number</label><input type="tel" name="phone"></div>
                    <div class="form-group"><label>Company Name</label><input type="text" name="company_name"></div>
                </div>
                <h2 class="mt-3">Notification Preferences</h2>
                <div class="form-grid">
                    <div class="form-group"><label style="font-weight:400;"><input type="checkbox" name="notify_sms"> SMS Notifications</label></div>
                    <div class="form-group"><label style="font-weight:400;"><input type="checkbox" name="notify_whatsapp"> WhatsApp Notifications</label></div>
                    <div class="form-group"><label style="font-weight:400;"><input type="checkbox" name="notify_email"> Email Notifications</label></div>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
